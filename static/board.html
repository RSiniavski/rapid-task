<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Task — Board</title>
  <link rel="icon" type="image/svg+xml" href="/resources/favico.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme-engine.js"></script>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>[v-cloak] { display: none; }</style>
</head>
<body>
<div id="app" v-cloak>

  <header class="site-header">
    <div class="container">
      <a href="/dashboard.html" class="logo">
        <img src="/resources/favico.svg" alt="Rapid Task" class="logo-mark">
        <span>Rapid Task</span>
      </a>
      <div class="header-actions">
        <span class="badge" :class="'role-' + role" v-if="role">{{ i18nGet('role.' + role) }}</span>
        <div class="lang-switch" title="Language">
          <button data-lang="uk">UK</button>
          <button data-lang="en">EN</button>
        </div>
        <a href="/dashboard.html" class="btn btn-ghost btn-sm">
          ← <span data-i18n="dash.title"></span>
        </a>
        <button type="button" class="cabinet-btn" @click="showProfile = true"
                :title="i18nGet('profile.open')" :aria-label="i18nGet('profile.open')" v-if="me">
          <user-avatar :user="me" :size="32"></user-avatar>
        </button>
      </div>
    </div>
  </header>

  <main class="container container-wide"
        style="padding-top: 28px; flex: 1; display: flex; flex-direction: column; min-height: 0;">
    <div v-if="error" class="card" style="border-color: var(--danger);">⚠️ {{ error }}</div>

    <template v-if="project">
      <div class="row" style="margin-bottom: 18px;">
        <h1 style="font-size: 22px;">{{ project.name }}</h1>
        <span class="badge badge-accent">{{ project.key }}</span>
        <span class="spacer"></span>
        <a class="btn btn-ghost btn-sm" :href="'/backlog.html?project=' + project.id" data-i18n="board.backlog" data-testid="board-backlog-link"></a>
        <a class="btn btn-ghost btn-sm" :href="'/roadmap.html?project=' + project.id" data-i18n="board.roadmap"></a>
        <button class="btn btn-primary btn-sm" @click="openCreate()" data-i18n="board.new_ticket"></button>
      </div>
      <div class="rm-toast" v-if="notice" role="status" data-testid="board-notice">ℹ️ {{ notice }}</div>

      <!-- ==================== ФІЛЬТРИ ==================== -->
      <div class="filter-top">
        <div class="assignee-strip" data-testid="assignee-filter">
          <button v-for="u in assigneesOnBoard" :key="u.id" type="button" class="as-btn"
                  :class="{ active: filters.assignee_ids.includes(u.id) }"
                  :title="u.full_name" :aria-label="u.full_name"
                  :aria-pressed="filters.assignee_ids.includes(u.id)"
                  @click="toggleAssignee(u.id)">
            <user-avatar :user="u" :size="32"></user-avatar>
          </button>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" data-testid="filter-toggle"
                :aria-expanded="showFilters" @click="showFilters = !showFilters">
          {{ i18nGet('filters.title') }} {{ showFilters ? '▴' : '▾' }}
          <span class="badge badge-accent" v-if="otherFiltersCount" style="margin-left: 4px;">{{ otherFiltersCount }}</span>
        </button>
        <span class="muted" data-testid="filter-count">
          {{ i18nGet('filters.shown').replace('{shown}', filteredCount).replace('{total}', tickets.length) }}
        </span>
        <button type="button" class="btn btn-ghost btn-sm" v-if="hasFilters"
                data-testid="filter-reset" @click="resetFilters">{{ i18nGet('filters.reset') }}</button>
      </div>

      <div class="filter-bar" v-if="showFilters" data-testid="filter-bar">
        <div class="filter-item">
          <label>{{ i18nGet('ticket.type') }}</label>
          <select class="input" v-model="filters.type" data-testid="filter-type">
            <option :value="null">{{ i18nGet('filters.all') }}</option>
            <option v-for="ty in types" :key="ty" :value="ty">{{ typeMeta(ty).icon }} {{ typeLabel(ty) }}</option>
          </select>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.tags') }}</label>
          <label-picker v-model="filters.tag_ids" :options="tagOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="filter-tags"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.components') }}</label>
          <label-picker v-model="filters.component_ids" :options="componentOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="filter-components"></label-picker>
        </div>
        <div class="filter-item">
          <label>{{ i18nGet('ticket.author') }}</label>
          <user-select v-model="filters.reporter_id" :users="memberUsers"
                       :placeholder="i18nGet('filters.all')"></user-select>
        </div>
        <div class="filter-item">
          <label>{{ i18nGet('ticket.tester') }}</label>
          <user-select v-model="filters.tester_id" :users="memberUsers" stub="🧪"
                       :placeholder="i18nGet('filters.all')"></user-select>
        </div>
      </div>

      <!-- ==================== KANBAN ==================== -->
      <div class="board-scroll">
        <div class="kanban-col" v-for="col in sortedColumns" :key="col.id">
          <div class="kanban-col-head">
            <span class="kanban-col-name">{{ col.name }}</span>
            <span class="kanban-count">{{ ticketsOf(col).length }}</span>
            <span v-if="col.is_done" :title="i18nGet('dash.settings.is_done')">✅</span>
            <span class="spacer"></span>
          </div>

          <div class="ticket-list" :data-column-id="col.id" :key="col.id + '-' + boardKey">
            <template v-for="group in groupsFor(col)" :key="group.anchorId">
              <!-- предок в іншій колонці: чип-посилання на нього -->
              <div v-if="group.label" class="family-label" @click="openByKey(group.labelKey)"
                   :title="i18nGet('ticket.parent')">
                ⬑ {{ group.label }}
              </div>
              <div v-for="item in group.items" :key="item.ticket.id"
                   class="ticket-card" :class="item.classes"
                   :data-ticket-id="item.ticket.id"
                   :style="{ paddingLeft: (12 + item.depth * 14) + 'px' }"
                   @click="openEdit(item.ticket)">
              <div class="row" style="gap: 6px;">
                <span class="ticket-icon" :title="typeLabel(item.ticket.type)">{{ typeMeta(item.ticket.type).icon }}</span>
                <span class="ticket-key">{{ item.ticket.key }}</span>
                <span v-if="item.ticket.parent_id" class="muted" style="font-size: 11px;"
                      :title="i18nGet('ticket.parent')">⬑</span>
                <span class="spacer"></span>
                <span v-if="item.ticket.closed_at" :title="i18nGet('ticket.closed')">✅</span>
              </div>
              <div class="ticket-title">{{ item.ticket.title }}</div>
              <div class="ticket-labels"
                   v-if="(item.ticket.tags && item.ticket.tags.length) || (item.ticket.components && item.ticket.components.length)">
                <span v-for="c in (item.ticket.components || []).slice(0, 2)" :key="'c' + c.id"
                      class="mini-chip comp" :title="i18nGet('ticket.components') + ': ' + c.name">▣ {{ c.name }}</span>
                <span v-for="tg in (item.ticket.tags || []).slice(0, 3)" :key="'t' + tg.id"
                      class="mini-chip tag" :title="i18nGet('ticket.tags') + ': ' + tg.name">#{{ tg.name }}</span>
                <span v-if="hiddenLabels(item.ticket) > 0" class="mini-chip">+{{ hiddenLabels(item.ticket) }}</span>
              </div>
              <div class="ticket-meta" v-if="item.ticket.assignee || item.ticket.tester">
                <span v-if="item.ticket.assignee" class="ticket-person"
                      :title="i18nGet('ticket.assignee') + ': ' + item.ticket.assignee.full_name">
                  <user-avatar :user="item.ticket.assignee" :size="22"></user-avatar>
                  {{ item.ticket.assignee.full_name.split(' ')[0] }}
                </span>
                <span v-if="item.ticket.tester" class="ticket-person"
                      :title="i18nGet('ticket.tester') + ': ' + item.ticket.tester.full_name">
                  <user-avatar :user="item.ticket.tester" :size="22"></user-avatar>
                  {{ item.ticket.tester.full_name.split(' ')[0] }}
                </span>
              </div>
              </div>
            </template>

            <div v-if="ticketsOf(col).length === 0" class="kanban-empty">
              —
            </div>
          </div>
        </div>
      </div>
    </template>

    <div v-else-if="!loading && !error" class="card text-center" data-i18n="common.loading"></div>
  </main>

  <!-- ==================== ДІАЛОГИ ТІКЕТА (спільні компоненти, js/ticket-dialogs.js) ==================== -->
  <ticket-create-dialog :project-id="projectId" :open="showCreate" :defaults="createDefaults"
                        @close="showCreate = false" @created="onCreated"></ticket-create-dialog>
  <ticket-edit-dialog :project-id="projectId" :ticket-key="editKey"
                      @close="editKey = null" @changed="onChanged"></ticket-edit-dialog>

  <!-- ==================== ОСОБИСТИЙ КАБІНЕТ ==================== -->
  <profile-modal :open="showProfile" :user="me" @close="showProfile = false"
                 @updated="onProfileUpdated"></profile-modal>

</div>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shared.js"></script>
<script src="/js/ticket-dialogs.js"></script>
<script src="/js/board.js"></script>
</body>
</html>
