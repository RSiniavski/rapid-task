<!DOCTYPE html>
<html lang="uk" x-data="boardApp()">
<head>
    <meta charset="UTF-8">
    <title>Rapid Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .kanban-col { min-height: 70vh; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Екран авторизації -->
    <template x-if="!token">
        <div class="min-h-screen flex items-center justify-center">
            <div class="bg-white p-8 rounded shadow-md w-96">
                <h2 class="text-2xl font-bold mb-4 text-center" x-text="isRegister ? 'Реєстрація' : 'Вхід в Rapid Task'"></h2>

                <form @submit.prevent="authSubmit()">
                    <template x-if="isRegister">
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Повне ім'я</label>
                            <input type="text" x-model="authForm.fullName" required class="w-full border p-2 rounded">
                        </div>
                    </template>

                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" x-model="authForm.email" required class="w-full border p-2 rounded">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Пароль</label>
                        <input type="password" x-model="authForm.password" required class="w-full border p-2 rounded">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700" x-text="isRegister ? 'Зареєструватися' : 'Увійти'"></button>
                </form>

                <p class="text-xs text-center mt-4 text-gray-600 cursor-pointer hover:underline" @click="isRegister = !isRegister" x-text="isRegister ? 'Вже є акаунт? Увійти' : 'Немає акаунта? Зареєструватися'"></p>
            </div>
        </div>
    </template>

    <!-- Основний контент (якщо є токен) -->
    <template x-if="token">
        <div>
            <!-- Повносторінковий режим для окремої вкладки (?ticket=RT-1) -->
            <template x-if="singleTicketView">
                <div class="max-w-3xl mx-auto my-10 bg-white p-8 rounded-lg shadow-md">
                    <div class="flex justify-between items-center border-b pb-4 mb-4">
                        <div class="flex items-center space-x-3">
                            <span class="text-2xl font-bold text-blue-600" x-text="singleTicketView.key"></span>
                            <span class="text-xs uppercase px-2 py-1 rounded font-semibold"
                                  :class="{
                                      'bg-red-100 text-red-700': singleTicketView.type === 'Bug',
                                      'bg-purple-100 text-purple-700': singleTicketView.type === 'Epic',
                                      'bg-blue-100 text-blue-700': singleTicketView.type === 'Task',
                                      'bg-gray-100 text-gray-700': singleTicketView.type === 'Subtask'
                                  }" x-text="singleTicketView.type"></span>
                        </div>
                        <a href="/" class="text-sm bg-gray-200 text-gray-700 px-3 py-1.5 rounded hover:bg-gray-300">На дошку</a>
                    </div>
                    <h1 class="text-xl font-bold mb-4" x-text="singleTicketView.title"></h1>

                    <div class="grid grid-cols-2 gap-4 mb-6 text-sm bg-gray-50 p-4 rounded border">
                        <div><strong>Статус:</strong> <span x-text="singleTicketView.status"></span></div>
                        <div><strong>Виконавець:</strong> <span x-text="singleTicketView.assignee ? singleTicketView.assignee.full_name : 'Unassigned'"></span></div>
                        <div><strong>Автор:</strong> <span x-text="singleTicketView.reporter ? singleTicketView.reporter.full_name : ''"></span></div>
                        <div><strong>Створено:</strong> <span x-text="new Date(singleTicketView.created_at).toLocaleString()"></span></div>
                    </div>

                    <div class="mb-6">
                        <h3 class="font-bold mb-2 text-gray-700">Опис</h3>
                        <p class="text-gray-600 whitespace-pre-wrap border p-3 rounded" x-text="singleTicketView.description || 'Опис відсутній'"></p>
                    </div>

                    <div>
                        <h3 class="font-bold mb-2 text-gray-700">Історія змін</h3>
                        <div class="space-y-2 max-h-48 overflow-y-auto border p-3 rounded bg-gray-50 text-xs">
                            <template x-for="h in singleTicketView.history" :key="h.id">
                                <div class="border-b pb-1 text-gray-600">
                                    <span class="font-semibold" x-text="new Date(h.created_at).toLocaleTimeString()"></span> -
                                    Зміна <strong x-text="h.field_changed"></strong>:
                                    <span class="line-through text-red-500" x-text="h.old_value || 'None'"></span> ➔
                                    <span class="text-green-600 font-semibold" x-text="h.new_value"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Основна Дошка -->
            <template x-if="!singleTicketView">
                <div class="p-6">
                    <!-- Верхня панель -->
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center space-x-4">
                            <h1 class="text-2xl font-bold text-gray-800">Rapid Task</h1>
                            <button @click="showCreateModal = true" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium">+ Створити тікет</button>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-semibold" x-text="user ? user.full_name : ''"></span>
                            <button @click="logout()" class="text-sm bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Вихід</button>
                        </div>
                    </div>

                    <!-- Дошка із 7 колонками -->
                    <div class="grid grid-cols-7 gap-3 overflow-x-auto">
                        <template x-for="status in columns" :key="status">
                            <div class="bg-gray-200 p-3 rounded-lg flex flex-col">
                                <h3 class="font-bold text-xs uppercase tracking-wider text-gray-600 mb-3" x-text="status"></h3>
                                <div class="kanban-col space-y-2 flex-1" :data-status="status">
                                    <template x-for="ticket in getTicketsByStatus(status)" :key="ticket.id">
                                        <div class="bg-white p-3 rounded shadow cursor-pointer hover:shadow-md transition"
                                             :data-id="ticket.id"
                                             @click="openTicketModal(ticket)">
                                            <div class="flex justify-between items-center mb-1">
                                                <!-- Клік на код відкриє в новій вкладці -->
                                                <a :href="'/?ticket=' + ticket.key"
                                                   target="_blank"
                                                   @click.stop
                                                   class="text-xs font-bold text-blue-600 hover:underline"
                                                   x-text="ticket.key"></a>

                                                <span class="text-[10px] uppercase px-1.5 py-0.5 rounded font-semibold"
                                                      :class="{
                                                          'bg-red-100 text-red-700': ticket.type === 'Bug',
                                                          'bg-purple-100 text-purple-700': ticket.type === 'Epic',
                                                          'bg-blue-100 text-blue-700': ticket.type === 'Task',
                                                          'bg-gray-100 text-gray-700': ticket.type === 'Subtask'
                                                      }" x-text="ticket.type"></span>
                                            </div>
                                            <h4 class="font-medium text-sm mb-2" x-text="ticket.title"></h4>
                                            <div class="text-xs text-gray-500 flex justify-between">
                                                <span>Виконавець:</span>
                                                <span class="font-medium text-gray-700" x-text="ticket.assignee ? ticket.assignee.full_name : 'Unassigned'"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- Поп-ап (модалка) детального перегляду тікета -->
    <div x-show="selectedTicket" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4 shadow-xl">
        <div class="flex justify-between items-center border-b pb-3">
            <h2 class="text-xl font-bold text-gray-800" x-text="selectedTicket?.title"></h2>
            <button @click="selectedTicket = null" class="text-gray-500 hover:text-gray-700 font-bold text-lg">&times;</button>
        </div>

        <div class="space-y-4" x-if="selectedTicket">
            <!-- Дропдаун Статусу -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Статус:</label>
                <select x-model="selectedTicket.status" class="w-full border rounded p-2 focus:ring focus:ring-blue-200">
                    <template x-for="status in columns" :key="status">
                        <option :value="status" x-text="status" :selected="status === selectedTicket.status"></option>
                    </template>
                </select>
            </div>

            <!-- Дропдаун Виконавця -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Виконавець:</label>
                <select x-model="selectedTicket.assignee_id" class="w-full border rounded p-2 focus:ring focus:ring-blue-200">
                    <option :value="null">-- Не призначено --</option>
                    <template x-for="user in users" :key="user.id">
                        <option :value="user.id" x-text="user.full_name" :selected="user.id === selectedTicket.assignee_id"></option>
                    </template>
                </select>
            </div>

            <!-- Редагований Опис -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Опис:</label>
                <textarea x-model="selectedTicket.description" rows="4" class="w-full border rounded p-2 focus:ring focus:ring-blue-200" placeholder="Введіть опис тікета..."></textarea>
            </div>
        </div>

        <!-- Кнопки дій -->
        <div class="flex justify-end space-x-2 border-t pt-4">
            <button @click="selectedTicket = null" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-100">Скасувати</button>
            <button @click="updateTicket()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium">Зберегти зміни</button>
        </div>
    </div>
</div>

    <!-- Модальне вікно створення -->
    <div x-show="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4" x-cloak>
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Створити новий тікет</h3>
            <form @submit.prevent="createTicket()">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Заголовок</label>
                    <input type="text" x-model="newTicket.title" required class="w-full border p-2 rounded">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Тип тікета</label>
                    <select x-model="newTicket.type" class="w-full border p-2 rounded">
                        <option value="Epic">Epic</option>
                        <option value="Task">Task</option>
                        <option value="Subtask">Subtask</option>
                        <option value="Bug">Bug</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Виконавець</label>
                    <select x-model="newTicket.assignee_id" class="w-full border p-2 rounded">
                        <option value="">Не призначено</option>
                        <template x-for="u in users" :key="u.id">
                            <option :value="u.id" x-text="u.full_name"></option>
                        </template>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Опис</label>
                    <textarea x-model="newTicket.description" class="w-full border p-2 rounded" rows="3"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" @click="showCreateModal = false" class="px-4 py-2 border rounded">Скасувати</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Створити</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
