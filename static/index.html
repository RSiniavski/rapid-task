<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Task — Small teams. Big things</title>
  <link rel="icon" type="image/svg+xml" href="/resources/favico.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme-engine.js"></script>
</head>
<body>

  <!-- ==================== ХЕДЕР ==================== -->
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">
        <img src="/resources/favico.svg" alt="Rapid Task" class="logo-mark">
        <span>Rapid Task</span>
      </a>

      <nav class="site-nav">
        <a href="#features" data-i18n="nav.features"></a>
        <a href="#how" data-i18n="nav.how"></a>
      </nav>

      <div class="header-actions">
        <div class="lang-switch" title="Language">
          <button data-lang="uk">UK</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="btn btn-primary btn-sm" data-open-auth="login" data-i18n="auth.login"></button>
        <button class="btn btn-ghost btn-sm" data-open-auth="register" data-i18n="auth.register"></button>
      </div>
    </div>
  </header>

  <!-- ==================== МЕІН ==================== -->
  <main>
    <!-- Hero -->
    <section class="hero container">
      <span class="badge badge-accent" data-i18n="hero.badge"></span>
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.subtitle"></p>
      <div class="hero-actions">
        <button class="btn btn-primary btn-lg" data-open-auth="register" data-i18n="hero.cta.start"></button>
        <a href="#features" class="btn btn-ghost btn-lg" data-i18n="hero.cta.more"></a>
      </div>
    </section>

    <!-- Можливості -->
    <section class="section container" id="features">
      <h2 class="section-title" data-i18n="features.title"></h2>
      <p class="section-subtitle" data-i18n="features.subtitle"></p>

      <div class="feature-grid">
        <div class="card card-hover feature-card">
          <div class="feature-icon">🗂️</div>
          <h3 data-i18n="features.f1.title"></h3>
          <p data-i18n="features.f1.text"></p>
        </div>
        <div class="card card-hover feature-card">
          <div class="feature-icon">📐</div>
          <h3 data-i18n="features.f2.title"></h3>
          <p data-i18n="features.f2.text"></p>
        </div>
        <div class="card card-hover feature-card">
          <div class="feature-icon">🛡️</div>
          <h3 data-i18n="features.f3.title"></h3>
          <p data-i18n="features.f3.text"></p>
        </div>
        <div class="card card-hover feature-card">
          <div class="feature-icon">📊</div>
          <h3 data-i18n="features.f4.title"></h3>
          <p data-i18n="features.f4.text"></p>
        </div>
        <div class="card card-hover feature-card">
          <div class="feature-icon">🏷️</div>
          <h3 data-i18n="features.f5.title"></h3>
          <p data-i18n="features.f5.text"></p>
        </div>
        <div class="card card-hover feature-card">
          <div class="feature-icon">🌘</div>
          <h3 data-i18n="features.f6.title"></h3>
          <p data-i18n="features.f6.text"></p>
        </div>
      </div>
    </section>

    <!-- Як це працює -->
    <section class="section container" id="how">
      <h2 class="section-title" data-i18n="how.title"></h2>
      <p class="section-subtitle" data-i18n="how.subtitle"></p>

      <div class="steps">
        <div class="step">
          <h3 data-i18n="how.step1.title"></h3>
          <p data-i18n="how.step1.text"></p>
        </div>
        <div class="step">
          <h3 data-i18n="how.step2.title"></h3>
          <p data-i18n="how.step2.text"></p>
        </div>
        <div class="step">
          <h3 data-i18n="how.step3.title"></h3>
          <p data-i18n="how.step3.text"></p>
        </div>
      </div>
    </section>
    <!-- Підтримка проєкту -->
    <section class="section container" id="support">
      <h2 class="section-title" data-i18n="support.title"></h2>
      <p class="section-subtitle" data-i18n="support.text"></p>

      <div class="support-card">
        <svg class="support-cup" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
          <path d="M26 8c0-2 3-2 3-5M36 8c0-2 3-2 3-5" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round"/>
          <rect x="14" y="14" width="32" height="6" rx="3" fill="#5eead4"/>
          <path d="M12 24h40v8c0 11-8 19-20 19S12 43 12 32z" fill="#5eead4"/>
          <path d="M52 28h2c5 0 8 3 8 7s-4 8-10 8" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 44l-8-8a4.6 4.6 0 0 1 8-4.6A4.6 4.6 0 0 1 40 36z" fill="#181b25"/>
        </svg>
        <div class="support-card-body">
          <a class="btn btn-primary btn-lg" href="/donate.html" target="_blank" rel="noopener">
            <span data-i18n="support.btn"></span> <span class="support-heart" aria-hidden="true">♥</span>
          </a>
          <div class="support-note" data-i18n="support.note"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== ФУТЕР ==================== -->
  <footer class="site-footer">
    <div class="container">

      <div class="footer-grid">
        <div>
          <h4 data-i18n="footer.about.title"></h4>
          <p data-i18n="footer.about.text"></p>
        </div>
        <div>
          <h4 data-i18n="footer.links.title"></h4>
          <a href="/docs" data-i18n="footer.docs"></a>
          <a href="/" data-i18n="footer.landing"></a>
          <a href="/donate.html" target="_blank" rel="noopener" data-i18n="footer.donate"></a>
        </div>
        <div>
          <h4 data-i18n="footer.contact.title"></h4>
          <a href="https://github.com/RSiniavski" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 Rapid Task. <span data-i18n="footer.rights"></span></span>
        <span data-i18n="footer.made_with"></span>
      </div>
    </div>
  </footer>

  <!-- ==================== МОДАЛКА АВТОРИЗАЦІЇ ==================== -->
  <div class="modal-backdrop" id="auth-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="auth-close" aria-label="Close">✕</button>

      <div class="modal-tabs">
        <button id="tab-login" class="active" data-i18n="auth.tab.login"></button>
        <button id="tab-register" data-i18n="auth.tab.register"></button>
      </div>

      <!-- Логін -->
      <form id="form-login">
        <div class="field">
          <label for="login-email" data-i18n="auth.email"></label>
          <input class="input" type="email" id="login-email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password" data-i18n="auth.password"></label>
          <input class="input" type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.login.btn"></button>
      </form>

      <!-- Реєстрація -->
      <form id="form-register" style="display:none">
        <div class="field">
          <label for="reg-name" data-i18n="auth.full_name"></label>
          <input class="input" type="text" id="reg-name" name="full_name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="reg-email" data-i18n="auth.email"></label>
          <input class="input" type="email" id="reg-email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="reg-password" data-i18n="auth.password"></label>
          <input class="input" type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-error" id="register-error"></div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.register.btn"></button>
      </form>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
