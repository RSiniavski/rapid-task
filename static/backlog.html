<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Task — Backlog</title>
  <link rel="icon" type="image/svg+xml" href="/resources/favico.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme-engine.js"></script>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <style>[v-cloak] { display: none; }</style>
</head>
<body>
<div id="app" v-cloak>

  <header class="site-header">
    <div class="container">
      <a href="/dashboard.html" class="logo">
        <img src="/resources/favico.svg" alt="Rapid Task" class="logo-mark">
        <span>Rapid Task</span>
      </a>
      <div class="header-actions">
        <span class="badge" :class="'role-' + role" v-if="role">{{ i18nGet('role.' + role) }}</span>
        <div class="lang-switch" title="Language">
          <button data-lang="uk">UK</button>
          <button data-lang="en">EN</button>
        </div>
        <a href="/dashboard.html" class="btn btn-ghost btn-sm">
          ← <span data-i18n="dash.title"></span>
        </a>
        <button type="button" class="cabinet-btn" @click="showProfile = true"
                :title="i18nGet('profile.open')" :aria-label="i18nGet('profile.open')" v-if="me">
          <user-avatar :user="me" :size="32"></user-avatar>
        </button>
      </div>
    </div>
  </header>

  <main class="container container-wide" style="padding-top: 28px;">
    <div v-if="error" class="card" style="border-color: var(--danger);">⚠️ {{ error }}</div>

    <template v-if="project">
      <div class="row" style="margin-bottom: 18px;">
        <h1 style="font-size: 22px;">{{ project.name }}</h1>
        <span class="badge badge-accent">{{ project.key }}</span>
        <span class="badge">📋 {{ i18nGet('backlog.title') }}</span>
        <span class="spacer"></span>
        <a class="btn btn-ghost btn-sm" :href="'/board.html?project=' + project.id"
           data-i18n="backlog.to_board" data-testid="bl-to-board"></a>
        <button type="button" class="btn btn-primary btn-sm" data-testid="bl-new-ticket"
                @click="openCreate()" data-i18n="board.new_ticket"></button>
        <a class="btn btn-ghost btn-sm" :href="'/roadmap.html?project=' + project.id" data-i18n="board.roadmap"></a>
      </div>

      <!-- ==================== SEARCH + FILTERS ==================== -->
      <div class="filter-top">
        <input class="input bl-search" type="search" v-model="search" data-testid="bl-search"
               :placeholder="i18nGet('backlog.search')" maxlength="100">
        <button type="button" class="btn btn-ghost btn-sm" data-testid="bl-filter-toggle"
                :aria-expanded="showFilters" @click="showFilters = !showFilters">
          {{ i18nGet('filters.title') }} {{ showFilters ? '▴' : '▾' }}
          <span class="badge badge-accent" v-if="filtersCount" style="margin-left: 4px;">{{ filtersCount }}</span>
        </button>
        <span class="muted" data-testid="bl-count">
          {{ i18nGet('filters.shown').replace('{shown}', filtered.length).replace('{total}', tickets.length) }}
        </span>
        <button type="button" class="btn btn-ghost btn-sm" v-if="hasFilters"
                data-testid="bl-filter-reset" @click="resetFilters">{{ i18nGet('filters.reset') }}</button>
        <span class="spacer"></span>
        <div class="bl-viewtoggle" data-testid="bl-view-toggle">
          <button type="button" class="btn btn-sm" :class="view === 'list' ? 'btn-soft' : 'btn-ghost'"
                  data-testid="bl-view-list" :aria-pressed="view === 'list'" @click="view = 'list'">{{ i18nGet('backlog.view.list') }}</button>
          <button type="button" class="btn btn-sm" :class="view === 'grouped' ? 'btn-soft' : 'btn-ghost'"
                  data-testid="bl-view-grouped" :aria-pressed="view === 'grouped'" @click="view = 'grouped'">{{ i18nGet('backlog.view.grouped') }}</button>
        </div>
        <div class="bl-cols">
          <button type="button" class="btn btn-ghost btn-sm" data-testid="bl-columns-btn"
                  :aria-expanded="showCols" @click.stop="showCols = !showCols">
            {{ i18nGet('backlog.columns') }} {{ showCols ? '▴' : '▾' }}
          </button>
          <div class="bl-cols-menu" v-if="showCols" data-testid="bl-columns-menu" @click.stop>
            <label v-for="c in allColumns" :key="c.key">
              <input type="checkbox" v-model="visible[c.key]" :data-testid="'bl-col-' + c.key"
                     :disabled="visible[c.key] && visibleCount === 1">
              {{ i18nGet('backlog.col.' + c.key) }}
            </label>
          </div>
        </div>
      </div>

      <div class="filter-bar" v-if="showFilters" data-testid="bl-filter-bar">
        <div class="filter-item">
          <label>{{ i18nGet('ticket.type') }}</label>
          <select class="input" v-model="filters.type" data-testid="bl-f-type">
            <option :value="null">{{ i18nGet('filters.all') }}</option>
            <option v-for="ty in types" :key="ty" :value="ty">{{ typeMeta(ty).icon }} {{ typeLabel(ty) }}</option>
          </select>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.milestone') }}</label>
          <label-picker v-model="filters.milestone_ids" :options="milestoneOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-milestones"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.assignee') }}</label>
          <label-picker v-model="filters.assignee_ids" :options="assigneeOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-assignees"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.author') }}</label>
          <label-picker v-model="filters.reporter_ids" :options="userOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-authors"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.tester') }}</label>
          <label-picker v-model="filters.tester_ids" :options="assigneeOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-testers"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.tags') }}</label>
          <label-picker v-model="filters.tag_ids" :options="tagOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-tags"></label-picker>
        </div>
        <div class="filter-item filter-wide">
          <label>{{ i18nGet('ticket.components') }}</label>
          <label-picker v-model="filters.component_ids" :options="componentOptions" :allow-new="false"
                        :placeholder="i18nGet('filters.all')" testid="bl-f-components"></label-picker>
        </div>
      </div>

      <!-- ==================== LIST ==================== -->
      <template v-if="view === 'list'">
        <div class="bl-wrap">
          <bl-table :rows="pageRows" :columns="shownColumns" :sort="sort" :lang="langTick"
                    @sort="toggleSort" @open="openTicket"></bl-table>
          <div class="bl-empty" v-if="!tickets.length" data-testid="bl-empty">{{ i18nGet('backlog.empty') }}</div>
          <div class="bl-empty" v-else-if="!filtered.length" data-testid="bl-no-matches">{{ i18nGet('backlog.no_matches') }}</div>
        </div>

        <div class="bl-pager row" data-testid="bl-pager" v-if="sorted.length > pageSize || pageSize !== 50">
          <label class="muted">{{ i18nGet('backlog.per_page') }}
            <select class="input" v-model.number="pageSize" data-testid="bl-page-size">
              <option v-for="n in pageSizes" :key="n" :value="n">{{ n }}</option>
            </select>
          </label>
          <span class="spacer"></span>
          <button type="button" class="btn btn-ghost btn-sm" data-testid="bl-prev"
                  :disabled="page <= 1" @click="goPage(page - 1)">{{ i18nGet('backlog.prev') }}</button>
          <span class="muted" data-testid="bl-page">{{ i18nGet('backlog.page') }} {{ Math.min(page, totalPages) }} / {{ totalPages }}</span>
          <button type="button" class="btn btn-ghost btn-sm" data-testid="bl-next"
                  :disabled="page >= totalPages" @click="goPage(page + 1)">{{ i18nGet('backlog.next') }}</button>
        </div>
      </template>

      <!-- ==================== BY MILESTONE ==================== -->
      <template v-else>
        <div class="bl-empty" v-if="!groups.length" data-testid="bl-no-matches">
          {{ tickets.length ? i18nGet('backlog.no_matches') : i18nGet('backlog.empty') }}
        </div>
        <section class="bl-group" v-for="g in groups" :key="g.key" :data-testid="'bl-group-' + g.key">
          <header class="bl-group-head">
            <button type="button" class="bl-collapse" :data-testid="'bl-toggle-' + g.key"
                    :aria-expanded="!isCollapsed(g.key)" @click="toggleGroup(g.key)">{{ isCollapsed(g.key) ? '▸' : '▾' }}</button>
            <h3 class="bl-group-title">{{ g.milestone ? g.milestone.title : i18nGet('backlog.no_milestone') }}</h3>
            <span class="badge" v-if="g.milestone" :class="{ 'badge-accent': !g.milestone.is_closed }">{{ groupStatus(g.milestone) }}</span>
            <span class="muted" :data-testid="'bl-group-count-' + g.key">{{ g.tickets.length }}</span>
            <span class="muted" v-if="g.milestone && g.milestone.tickets_total">
              · {{ g.milestone.tickets_done }}/{{ g.milestone.tickets_total }} ({{ g.milestone.progress }}%)
            </span>
            <span class="spacer"></span>
            <button type="button" class="btn btn-ghost btn-sm" v-if="!g.milestone || !g.milestone.is_closed"
                    :data-testid="'bl-add-' + g.key"
                    :title="g.milestone ? i18nGet('rm.new_ticket_in') : i18nGet('board.new_ticket')"
                    @click="openCreate(g.milestone ? { milestone_id: g.milestone.id } : {})">＋</button>
          </header>
          <div class="bl-wrap" v-show="!isCollapsed(g.key)">
            <bl-table v-if="g.tickets.length" :rows="g.tickets" :columns="groupColumns" :sort="sort" :lang="langTick"
                      :testid="'bl-table-' + g.key" @sort="toggleSort" @open="openTicket"></bl-table>
            <div class="bl-empty" v-else>{{ i18nGet('backlog.group_empty') }}</div>
          </div>
        </section>
      </template>
    </template>

    <div v-if="loading" class="muted">…</div>
  </main>

  <ticket-create-dialog :project-id="projectId" :open="showCreate" :defaults="createDefaults"
                        @close="showCreate = false" @created="reloadTickets"></ticket-create-dialog>
  <ticket-edit-dialog :project-id="projectId" :ticket-key="editKey"
                      @close="editKey = null" @changed="reloadTickets"></ticket-edit-dialog>

  <profile-modal :open="showProfile" :user="me" @close="showProfile = false"
                 @updated="onProfileUpdated"></profile-modal>

</div>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shared.js"></script>
<script src="/js/ticket-dialogs.js"></script>
<script src="/js/backlog.js"></script>
</body>
</html>
